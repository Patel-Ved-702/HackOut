version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: renewguard_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./renewguard.db
      - SECRET_KEY=hackout-2026-production-secret-key
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: renewguard_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
